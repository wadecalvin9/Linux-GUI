<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kali File Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #1e1f23;
            color: #e4e4e4;
            font-family: "Ubuntu", sans-serif;
            overflow: hidden;
        }

        .file-explorer {
            width: 100vw;
            height: 100vh;
            background: #2b2e33;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            background: #35383d;
            border-bottom: 1px solid #1b1c1f;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn {
            background: #2b2e33;
            border: 1px solid #1b1c1f;
            color: #ccc;
            border-radius: 4px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tool-btn:hover {
            background: #44484f;
            color: #7cc0ff;
        }

        .address-bar {
            background: #232528;
            border: 1px solid #1b1c1f;
            border-radius: 4px;
            padding: 4px 8px;
            color: #aaa;
            font-size: 13px;
        }

        .path-part.active {
            color: #7cc0ff;
        }

        .search {
            background: #232528;
            border: 1px solid #1b1c1f;
            border-radius: 4px;
            padding: 4px 8px;
            color: #ccc;
            outline: none;
            width: 140px;
        }

        /* Body layout */
        .explorer-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background: #26292e;
            border-right: 1px solid #1b1c1f;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .side-title {
            font-size: 12px;
            color: #7cc0ff;
            padding: 8px 10px 4px;
        }

        .side-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            font-size: 13px;
            color: #bbb;
            cursor: pointer;
        }

        .side-item:hover {
            background: #3b3e44;
        }

        .side-item.active {
            background: #3b3e44;
            color: #7cc0ff;
        }

        .file-grid {
            flex: 1;
            background: #2b2e33;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            padding: 10px 10px 0 10px;
            /* remove bottom padding */
            overflow-y: auto;
            align-content: start;
            /* keep items pinned to top */
        }

        .file-item {
            text-align: center;
            font-size: 13px;
            color: #ccc;
            border-radius: 6px;
            padding: 10px;
            transition: background 0.2s;
            cursor: pointer;
        }

        .file-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }

        .file-item p {
            margin: 4px 0 0 0;
        }


        .file-item:hover {
            background: #3b3e44;
        }

        .file-item i {
            font-size: 26px;
            color: #7cc0ff;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="file-explorer">
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="tool-btn"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="tool-btn"><i class="fa-solid fa-arrow-right"></i></button>
                <button class="tool-btn"><i class="fa-solid fa-arrow-up"></i></button>
                <div class="address-bar">
                    <span class="path-part">computer</span> /
                    <span class="path-part">root</span> /
                    <span class="path-part active">File System</span>
                </div>
            </div>
            <input class="search" placeholder="Search..." />
        </div>

        <div class="explorer-body">
            <div class="sidebar">
                <div class="side-title">PLACES</div>
                <div class="side-item active"><i class="fa-solid fa-house"></i> Home</div>
                <div class="side-item"><i class="fa-solid fa-folder"></i> Documents</div>
                <div class="side-item"><i class="fa-solid fa-download"></i> Downloads</div>
                <div class="side-item"><i class="fa-solid fa-music"></i> Music</div>
                <div class="side-item"><i class="fa-solid fa-video"></i> Videos</div>
                <div class="side-item"><i class="fa-solid fa-hdd"></i> File System</div>
                <div class="side-item"><i class="fa-solid fa-trash"></i> Trash</div>
            </div>

            <div class="file-grid">
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>bin</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>boot</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>dev</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>etc</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>home</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>lib</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>mnt</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>opt</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>root</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>usr</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-folder"></i>
                    <p>var</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-file"></i>
                    <p>vmlinuz</p>
                </div>
                <div class="file-item"><i class="fa-solid fa-file"></i>
                    <p>initrd.img</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
